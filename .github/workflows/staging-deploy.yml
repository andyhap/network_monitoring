name: Deploy Staging

on:
  push:
    branches:
      - websocket-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add VPS Host
        run: |
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "cd ~/monitoring && git pull origin websocket-server && docker compose up -d --build"
